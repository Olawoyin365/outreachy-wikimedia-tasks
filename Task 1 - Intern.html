<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ibrahim - Task 1</title>
    <style>
        .block { 
            background-color: gainsboro; 
            padding: 1em;
            white-space: pre-line;
            font-family: monospace;
            min-height: 50px;
        } 
    </style>
</head>
<body>
    <h1>Ibrahim - Task 1</h1>
    <h2>My code:</h2>
    <p id="code" class="block"></p>
    <h2>Results of my code:</h2>
    <p id="results" class="block"></p>
    
    <script id="task_id">
        // INPUT
        let data = [
            {"page_id": 6682420, "creation_date": "2021-09-13", "title": "André Baniwa"},
            {"page_id": 4246775, "creation_date": "2013-12-10", "title": "Benki Piyãko"},
            {"page_id": 5882073, "creation_date": "2018-12-03", "title": "Célia Xakriabá"},
            {"page_id": 6977673, "creation_date": "2022-10-05", "title": "Chirley Pankará"},
            {"page_id": 7069044, "creation_date": "2023-02-16", "title": "Cristine Takuá"},
            {"page_id": 2119511, "creation_date": "2009-01-28", "title": "Eliane Potiguara"},
            {"page_id": 6714407, "creation_date": "2021-10-09", "title": "Jaider Esbell"},
            {"page_id": 6977117, "creation_date": "2022-10-04", "title": "Jerônimo Rodrigues"},
            {"page_id": 6935831, "creation_date": "2022-08-02", "title": "Nanblá Gakran"},
            {"page_id": 4908665, "creation_date": "2015-11-13", "title": "Sônia Guajajara"},
            {"page_id": 5886895, "creation_date": "2018-12-12", "title": "Vãngri Kaingáng"},
            {"page_id": 6549130, "creation_date": "2021-04-10", "title": "Zezico Guajajara"}
        ];

        // YOUR CODE HERE
        
        // Function to convert date string (YYYY-MM-DD) to human-readable format (Month Day, Year)
        function formatDate(dateString) {
            // Create a Date object from the ISO date string
            const date = new Date(dateString);
            
            // Array of month names for formatting
            const months = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            
            // Extract month, day, and year from the date
            const month = months[date.getMonth()];
            const day = date.getDate();
            const year = date.getFullYear();
            
            // Return formatted string: "Month Day, Year"
            return month + " " + day + ", " + year;
        }
        
        // Get the HTML element where we'll display the results
        const resultsElement = document.getElementById("results");
        
        // Initialize an empty array to store formatted lines
        let outputLines = [];
        
        // Process each article in the data array
        data.forEach(function(article) {
            // Format the creation date for this article
            const formattedDate = formatDate(article.creation_date);
            
            // Build the formatted line as specified in requirements
            const line = 'Article "' + article.title + '" (Page ID ' + article.page_id + ') was created at ' + formattedDate + '.';
            
            // Add this line to our output array
            outputLines.push(line);
        });
        
        // Join all lines with line breaks and display in the results element
        resultsElement.innerText = outputLines.join('\n');
        
    </script>
    
    <script>
        document.getElementById("code").innerText = document.getElementById("task_id").text;
    </script>
</body>
</html>
